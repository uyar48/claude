# Word pictures (free stock photos) and speech (Kokoro-82M, runs on the runner),
# then validation; commits the result. Optional free keys as repository
# secrets: PEXELS_API_KEY, PIXABAY_API_KEY (Settings → Secrets and variables →
# Actions). Without them Openverse and Wikimedia Commons are used.
name: Medya

on:
  workflow_dispatch:
    inputs:
      force_images:
        description: 'Fotoğrafları yeniden ara (mevcut adayları değiştir)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pictures
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npx tsx scripts/fetch-images.ts ${{ inputs.force_images && '--force' || '' }}
      - name: Speech
        run: npx tsx scripts/generate-audio.ts
      - run: npx tsx scripts/validate-content.ts
      - name: Commit
        run: |
          git config user.name "okuma-media"
          git config user.email "okuma-media@users.noreply.github.com"
          git add public/media content/media src/content/media-manifest.json content/build/validation.md
          git diff --cached --quiet || git commit -m "media: pictures and speech"
          git push
